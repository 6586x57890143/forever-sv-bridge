name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: self-check (Windows PowerShell 5.1, with coverage)
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File forever_sv_bridge.tests.ps1 -Coverage
      - name: self-check (PowerShell 7)
        shell: pwsh
        run: ./forever_sv_bridge.tests.ps1
      - name: encoding contract
        shell: pwsh
        run: |
          $b = [IO.File]::ReadAllBytes("forever_sv_bridge.ps1")
          if (-not ($b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF)) { throw "forever_sv_bridge.ps1 lost its UTF-8 BOM (Windows PowerShell would misparse the art)" }
          $i = [IO.File]::ReadAllText("install.ps1")
          if ($i -match "[^\x09\x0A\x0D\x20-\x7E]") { throw "install.ps1 must stay pure ASCII (it is piped through irm | iex)" }
          if (Select-String -Path *.ps1, README.md -Pattern "DOMAIN" -Quiet) { Write-Host "::warning::DOMAIN placeholder still present" }
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: self-check (pwsh on Linux, systemd path)
        shell: pwsh
        run: ./forever_sv_bridge.tests.ps1 -Coverage
      - name: install.sh (pwsh stubbed, BOM-less download must come out byte-identical to the repo file)
        shell: bash
        run: |
          mkdir -p stub srv && printf '#!/bin/sh\necho "$@" > "$STUB_LOG"\n' > stub/pwsh && chmod +x stub/pwsh
          tail -c +4 forever_sv_bridge.ps1 > srv/forever_sv_bridge.ps1
          export STUB_LOG=$PWD/stub.log XDG_DATA_HOME=$PWD/data
          PATH=$PWD/stub:$PATH SV_BASE=file://$PWD/srv sh install.sh -GamePath /x
          cmp forever_sv_bridge.ps1 data/ForeverSVBridge/forever_sv_bridge.ps1
          grep -qx -- "-NoProfile -File $PWD/data/ForeverSVBridge/forever_sv_bridge.ps1 -GamePath /x" stub.log
